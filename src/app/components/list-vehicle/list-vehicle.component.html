<div class="container-all">
    <h1>Vehiculos en parqueadero</h1>
    <div class="container-table">
        <div class="mat-elevation-z8">
          <table mat-table [dataSource]="dataSource">
            <!-- Columna Placa -->
            <ng-container matColumnDef="licensePlate">
              <th mat-header-cell *matHeaderCellDef> Placa </th>
              <td mat-cell *matCellDef="let vehicle"> {{ vehicle.licensePlate }} </td>
            </ng-container>
          
            <ng-container matColumnDef="entryTime">
              <th mat-header-cell *matHeaderCellDef> Hora de Entrada </th>
              <td mat-cell *matCellDef="let vehicle"> {{ vehicle.entryTime }} </td>
            </ng-container>
          
            <ng-container matColumnDef="exitTime">
              <th mat-header-cell *matHeaderCellDef> Hora de Salida </th>
              <td mat-cell *matCellDef="let vehicle"> {{ vehicle.exitTime || 'No ha salido' }} </td>
            </ng-container>
 
              <ng-container matColumnDef="spot">
                <th mat-header-cell *matHeaderCellDef> Lugar</th>
                <td mat-cell *matCellDef="let vehicle"> {{ vehicle.assignedSpot }} </td>
              </ng-container>
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef> Acción </th>
              <td mat-cell *matCellDef="let vehicle">
                <button mat-button (click)="darSalida(vehicle)"   [disabled]="vehicle.exitTime !== null">Dar salida</button>
              </td>
            </ng-container>
          
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      
            <tr class="no-data-row" *matNoDataRow>
              <td colspan="4">🚗 No hay vehículos en el parqueadero 🚗</td>
            </tr>
          </table>
        </div>
      </div>
      
      
</div>
